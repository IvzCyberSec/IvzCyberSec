name: Profile cards

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - render_cards.py
      - fonts/**
      - assets/**
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          mkdir -p data
          gh api graphql -F login='${{ github.repository_owner }}' -f query='
            query($login: String!) {
              user(login: $login) {
                login
                name
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount contributionLevel } }
                  }
                }
                repositories(first: 100, ownerAffiliations: OWNER, privacy: PUBLIC,
                             orderBy: {field: PUSHED_AT, direction: DESC}) {
                  nodes { name url description stargazerCount forkCount pushedAt
                          primaryLanguage { name color } }
                }
              }
            }' > data/github.json.tmp
          mv data/github.json.tmp data/github.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install --quiet "fonttools>=4.47"
          python render_cards.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
